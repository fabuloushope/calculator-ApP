<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Web calculator</title>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly placeholder="0">

        <div class="buttons">
            <button onclick="values()" class="btn operator">C</button>
            <button onclick="values('/')" class="btn operator">/</button>
            <button onclick="values('*')" class="btn operator">*</button>
            <button onclick="values('-')" class="btn operator">-</button>

            <button onclick="values('7')" class="btn">7</button>
            <button onclick="values('8')" class="btn">8</button>
            <button onclick="values('9')" class="btn">9</button>
            <button onclick="values('+')" class="btn operator">+</button>

            <button onclick="values('4')" class="btn">4</button>
            <button onclick="values('5')" class="btn">5</button>
            <button onclick="values('6')" class="btn">6</button>
            <button onclick="values('=')" class="btn equals">=</button>

            <button onclick="values('1')" class="btn">1</button>
            <button onclick="values('2')" class="btn">2</button>
            <button onclick="values('3')" class="btn">3</button>
            <button onclick="values('0')" class="btn zero">0</button>

            <button onclick="values('.')" class="btn">.</button>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
